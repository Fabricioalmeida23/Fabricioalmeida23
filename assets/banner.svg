<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Fabricio Almeida — Dados, BI e plataformas para o setor publico">
  <title>Fabricio Almeida — Dados, BI e plataformas para o setor publico</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070F1C"/>
      <stop offset="0.55" stop-color="#0B1729"/>
      <stop offset="1" stop-color="#0D1E36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#4C8FFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4C8FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8FFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4C8FFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8FFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4C8FFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="270" rx="14"/></clipPath>
  </defs>

  <style>
    .s  { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    .m  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .in { opacity: 0; animation: in .9s cubic-bezier(.22,.7,.2,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .30s } .d3 { animation-delay: .45s }
    .d4 { animation-delay: .60s } .d5 { animation-delay: .75s }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

    .line { fill: none; stroke: #4C8FFF; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1500; stroke-dashoffset: 1500;
            animation: draw 2.8s cubic-bezier(.32,.62,.24,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    .fill { opacity: 0; animation: soft 1.6s ease-out 1.9s forwards }
    @keyframes soft { to { opacity: 1 } }

    .dot { opacity: 0; animation: pop .5s ease-out forwards }
    @keyframes pop { to { opacity: 1 } }
    .p1{animation-delay:1.05s} .p2{animation-delay:1.30s} .p3{animation-delay:1.55s}
    .p4{animation-delay:1.80s} .p5{animation-delay:2.05s} .p6{animation-delay:2.30s}
    .p7{animation-delay:2.55s} .p8{animation-delay:2.80s} .p9{animation-delay:3.05s}

    .caret { animation: blink 1.15s steps(1, end) infinite }
    @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="270" fill="url(#glow)"/>

    <g stroke="#1B3557" stroke-width="1" opacity="0.30">
      <path d="M620 92h520M620 148h520M620 204h520" stroke-dasharray="3 9"/>
    </g>
    <g fill="#1B3557" opacity="0.55">
      <circle cx="96" cy="42" r="2"/><circle cx="212" cy="238" r="2"/><circle cx="486" cy="52" r="2"/>
      <circle cx="392" cy="244" r="2"/><circle cx="560" cy="150" r="2"/>
    </g>

    <path class="fill" fill="url(#area)"
      d="M620 196C652.5 196 652.5 176 685 176C717.5 176 717.5 202 750 202C782.5 202 782.5 152 815 152C847.5 152 847.5 166 880 166C912.5 166 912.5 120 945 120C977.5 120 977.5 134 1010 134C1042.5 134 1042.5 86 1075 86C1107.5 86 1107.5 62 1140 62C1170 62 1175 52 1200 44L1200 250L620 250Z"/>

    <path class="line"
      d="M620 196C652.5 196 652.5 176 685 176C717.5 176 717.5 202 750 202C782.5 202 782.5 152 815 152C847.5 152 847.5 166 880 166C912.5 166 912.5 120 945 120C977.5 120 977.5 134 1010 134C1042.5 134 1042.5 86 1075 86C1107.5 86 1107.5 62 1140 62C1170 62 1175 52 1200 44"/>

    <g fill="#070F1C" stroke="#4C8FFF" stroke-width="2">
      <circle class="dot p1" cx="620" cy="196" r="3.6"/>
      <circle class="dot p2" cx="685" cy="176" r="3.6"/>
      <circle class="dot p3" cx="750" cy="202" r="3.6"/>
      <circle class="dot p4" cx="815" cy="152" r="3.6"/>
      <circle class="dot p5" cx="880" cy="166" r="3.6"/>
      <circle class="dot p6" cx="945" cy="120" r="3.6"/>
      <circle class="dot p7" cx="1010" cy="134" r="3.6"/>
      <circle class="dot p8" cx="1075" cy="86" r="3.6"/>
    </g>

    <g class="dot p9">
      <circle cx="1140" cy="62" r="6" fill="none" stroke="#4C8FFF" stroke-width="1.4" opacity="0.6">
        <animate attributeName="r" values="6;17" dur="2.8s" begin="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="2.8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1140" cy="62" r="5" fill="#4C8FFF"/>
    </g>

    <g class="in d1">
      <circle cx="66" cy="72" r="3" fill="#4C8FFF"/>
      <text class="m" x="80" y="77" fill="#A9B7C6" fill-opacity="0.78" font-size="12" letter-spacing="2.6">BUSINESS INTELLIGENCE · ANALYTICS · ALAGOAS</text>
    </g>

    <text class="s in d2" x="64" y="140" font-size="50" font-weight="700" letter-spacing="-1.2">
      <tspan fill="#F5F8FB">Fabricio </tspan><tspan fill="#4C8FFF">Almeida</tspan>
    </text>

    <text class="s in d3" x="64" y="176" font-size="17" fill="#A9B7C6">Assessor Especial de Projetos</text>
    <text class="s in d4" x="64" y="200" font-size="17" fill="#4A5B70">Secretaria de Estado da Governança Corporativa · Alagoas</text>

    <g class="in d5">
      <rect x="64" y="220" width="2" height="18" fill="url(#rule)"/>
      <text class="m" x="80" y="234" font-size="13" fill="#A9B7C6" fill-opacity="0.9" letter-spacing="0.6">SQL · Python · Power BI · TypeScript</text>
      <rect class="caret" x="392" y="222" width="8" height="14" fill="#4C8FFF"/>
    </g>

    <rect x="0" y="0" width="1200" height="270" rx="14" fill="none" stroke="#1B3557" stroke-opacity="0.7"/>
  </g>
</svg>
